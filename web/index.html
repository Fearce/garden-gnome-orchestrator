<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover makes the env(safe-area-inset-*) already used by the detail header and the
         bottom nav resolve to real values instead of 0. interactive-widget=resizes-content shrinks the
         LAYOUT viewport when the soft keyboard opens, so the 100dvh shell re-lays-out and the composer /
         inject bar stay above the keyboard — declaratively, with no visualViewport listener. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>GG Orchestrator</title>
    <link rel="icon" type="image/png" href="gnome-mark.png" />
    <!-- The typefaces come from the bundle (web/src/main.tsx imports the @fontsource faces), not a
         font CDN: this console is served on the LAN and must render its full identity offline.
         `test:themes` fails if an external font link reappears here. -->
    <!-- Paint the chosen theme BEFORE the stylesheet does. The bundle runs after first paint, so
         applying the theme from JS alone flashes the Classic palette on every load. Reads the same
         `director_settings` record web/src/store.ts writes; the id list mirrors THEMES in
         web/src/lib/theme.ts (Classic is the absence of the attribute) and `test:themes` fails if a
         theme ever ships without being listed here. -->
    <!-- The chosen typefaces are painted here for a sharper reason than the theme's: a face applied
         after the bundle loads reflows the entire console once on every load, not just recolours it.
         The id lists mirror UI_FONTS / MONO_FONTS / DISPLAY_FONTS in web/src/lib/font.ts ("default" is
         the absence of the attribute) and `test:fonts` fails if a face ever ships without being
         listed here. -->
    <script>
      try {
        var v = JSON.parse(localStorage.getItem("director_settings") || "{}");
        var t = v.theme;
        if (["nocturne"].indexOf(t) >= 0) document.documentElement.dataset.theme = t;
        var f = v.uiFont;
        if (["system", "geist", "plex-sans", "source-serif", "space-grotesk", "jetbrains"].indexOf(f) >= 0)
          document.documentElement.dataset.font = f;
        var m = v.monoFont;
        if (["system", "plex-mono", "fira-code", "source-code"].indexOf(m) >= 0)
          document.documentElement.dataset.fontMono = m;
        var d = v.displayFont;
        if (
          ["geist", "instrument-sans", "space-grotesk", "bricolage", "instrument-serif", "source-serif", "jetbrains"].indexOf(d) >= 0
        )
          document.documentElement.dataset.fontDisplay = d;
      } catch (e) {
        /* private mode / corrupt record — Classic and the theme's own faces are the right fallback */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

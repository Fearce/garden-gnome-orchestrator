# Runs the Online Office relay as its OWN compose project on a host that already has a reverse proxy
# (e.g. Caddy) owning 80/443. It publishes no host port: the proxy reaches it by container name over the
# proxy's existing docker network, named by RELAY_PROXY_NETWORK in `.env`, so the relay's lifecycle is never
# entangled with whatever else runs there. Deploy with `deploy.sh`; secrets live in `.env` beside this file.

name: gg-office-relay

services:
  relay:
    build: .
    image: gg-office-relay:latest
    container_name: gg-office-relay
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8787
      DATA_DIR: /data
    volumes:
      - relay-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - proxy

networks:
  # The network the reverse proxy is already on. External, so this project never creates or owns it.
  proxy:
    external: true
    name: ${RELAY_PROXY_NETWORK:?set RELAY_PROXY_NETWORK in .env to the docker network your reverse proxy is on}

volumes:
  relay-data:
